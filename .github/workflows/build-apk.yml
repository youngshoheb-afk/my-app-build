name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Tools
        run: sudo apt-get install -y android-sdk apksigner zipalign zip

      - name: Clean & Pack APK
        run: |
          # पुरानी सिग्नेचर हटाएं ताकि कोई Conflict न हो
          rm -rf META-INF
          # बिना compression के APK पैक करें (Android के लिए ज़रूरी है)
          zip -r -0 app-release-unsigned.apk . -x "*.git*" "*.github*"

      - name: Zipalign APK
        run: |
          zipalign -v 4 app-release-unsigned.apk app-aligned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --min-sdk-version 21 app-aligned.apk
          mv app-aligned.apk app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: app-release.apk

name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk apksigner zipalign zip

      - name: Create Unsigned APK
        run: |
          zip -r unaligned.apk . -x "*.git*" "*.github*"

      - name: Zipalign APK
        run: |
          zipalign -v 4 unaligned.apk app-release-unsigned.apk

      - name: Sign APK (Debug Key)
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --min-sdk-version 21 app-release-unsigned.apk
          mv app-release-unsigned.apk app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: app-release.apk
